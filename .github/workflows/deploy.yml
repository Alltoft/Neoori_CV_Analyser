# Build both images in CI, push to GHCR, then update the VPS over SSH.
# Replaces the Vercel/Render auto-deploys: `git push` stays the whole workflow.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST      e.g. 186.240.157.26
#   VPS_USER      e.g. root (or a dedicated deploy user)
#   VPS_SSH_KEY   private key of a DEDICATED deploy keypair (never a personal key)
# Until these exist, the build job still pushes images; only `deploy` fails.
name: deploy

on:
  push:
    branches: [initial, main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/alltoft/neoori-backend:latest
            ghcr.io/alltoft/neoori-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          tags: |
            ghcr.io/alltoft/neoori-frontend:latest
            ghcr.io/alltoft/neoori-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep compose + nginx config on the VPS in sync with the repo
      # (the VPS has no git checkout; images carry the application code).
      - name: Sync compose + nginx to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx"
          target: /srv/neoori

      - name: Pull images & restart stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/neoori
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
