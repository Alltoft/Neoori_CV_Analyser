# Dev proxy: mirrors production routing on http://localhost.
# / -> Next.js dev server (3001, websocket for HMR), /api -> Flask (5001).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP limits on the auth endpoints (email verification spec, decision 21;
# social sign-in spec, decision 23).
# Each map turns every other URI into an empty key, which limit_req does not
# count, so the rest of /api/ is untouched. envsubst leaves $uri and
# $binary_remote_addr alone: it only replaces names set in the environment.
# The key is wrong for IPv6 clients (docker-proxy hides them): never publish
# an AAAA record, see DOCKER.md, "Do not publish an AAAA record".
map $uri $auth_mail_key {
    ~^/api/(auth/(register|resend-verification|forgot-password|email-link)|counselor/apply)/?$  $binary_remote_addr;
    default "";
}
map $uri $auth_login_key {
    ~^/api/auth/(login|verify-email|reset-password|email-link/(check|consume)|signup)/?$  $binary_remote_addr;
    default "";
}
limit_req_zone $auth_mail_key  zone=auth_mail:10m  rate=5r/m;
limit_req_zone $auth_login_key zone=auth_login:10m rate=10r/m;
# Looser for the OAuth round trip: each provider sign-in costs two requests
# (start, callback), a France Travail workshop puts a whole room behind one
# address, and neither endpoint checks a secret anyone could guess.
map $uri $auth_oauth_key {
    ~^/api/auth/(google|microsoft)/(start|callback)/?$  $binary_remote_addr;
    default "";
}
limit_req_zone $auth_oauth_key zone=auth_oauth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m; # CV upload cap is 10 MB + multipart overhead

    location /api/ {
        limit_req zone=auth_mail  burst=3 nodelay;
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;       # analysis responses arrive after minutes
        proxy_read_timeout 600s;
    }

    # The OAuth round trip is a top-level navigation: a 429 there must land
    # on /connexion with its sentence, not on nginx's bare page. Every other
    # /api/ URI keeps the plain 429 that api.ts turns into French.
    location ~ ^/api/auth/(google|microsoft)/(start|callback)/?$ {
        limit_req zone=auth_oauth burst=10 nodelay;
        error_page 429 = @oauth_throttled;
        # Proxied as location /api/ is: only the limit and its 429 differ.
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location @oauth_throttled {
        absolute_redirect off;     # relative Location: right host and port behind docker
        return 302 /connexion?erreur=echec;
    }

    location / {
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # Next.js HMR websocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
