services:
  mysql:
    image: mysql:8.4
    container_name: neoori_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: neoori_dev
      MYSQL_DATABASE: neoori
      MYSQL_USER: neoori
      MYSQL_PASSWORD: neoori_dev
    ports:
      - "3306:3306"
    volumes:
      - neoori_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  neoori_mysql_data:
